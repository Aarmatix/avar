name: release @avar-standard/verify-wasm

on:
  push:
    tags:
      - "verify-wasm@*"

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install Javy
        run: |
          # Pin to a known-good release; "latest" filename drifts.
          JAVY_VER=v5.0.4
          curl -sSL https://github.com/bytecodealliance/javy/releases/download/${JAVY_VER}/javy-x86_64-linux-${JAVY_VER}.gz \
            | gunzip > /usr/local/bin/javy && chmod +x /usr/local/bin/javy
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: packages/verify-wasm
      - name: Build + verify surface + parity
        run: |
          npm run build
          npm run test:surface
          npm run test:strings
        working-directory: packages/verify-wasm
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/verify-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AVAR_STANDARD_TOKEN }}
