name: release @avar-standard/verify-wasm

on:
  push:
    tags:
      - "verify-wasm@*"

permissions:
  contents: read
  id-token: write # required for npm --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install Javy
        run: |
          curl -sSL https://github.com/bytecodealliance/javy/releases/latest/download/javy-x86_64-linux-v3.0.0.gz \
            | gunzip > /usr/local/bin/javy && chmod +x /usr/local/bin/javy
      - name: Install
        run: npm ci
        working-directory: packages/verify-wasm
      - name: Build + verify surface + parity
        run: |
          npm run build
          npm run test:surface
          npm run test:strings
          npm run test:parity
        working-directory: packages/verify-wasm
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/verify-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
